      <header class="ova-screen__head" data-reveal>
        <div class="ova-screen__eyebrow">Unidad <span data-ova-hueco="número de la unidad"></span></div>
        <h1 class="ova-screen__title">Créditos</h1>
      </header>

      <!-- Sección «Créditos» del Word (cargo, persona, versión y año), con la pieza de Andina
           (.ua-creditos, como la unidad-demo) y sin fotografías: el Word no las trae.
           La línea de la unidad sale de la portada del DI; va un .ua-creditos__rol por cada cargo del
           Word; el © es lo fijo de la institución, con el año del Word (KIT-018, D17). -->
      <section class="ua-creditos" data-reveal>
        <p class="ua-creditos__unidad" data-ova-hueco="número y título de la unidad, de la portada del DI"></p>
        <dl class="ua-creditos__roles">
          <div class="ua-creditos__rol">
            <dt><strong data-ova-hueco="cargo, literal de la sección «Créditos» del DI"></strong></dt>
            <dd data-ova-hueco="persona, literal del DI"></dd>
          </div>
        </dl>
        <footer class="ua-creditos__pie">
          <span data-ova-hueco="versión, literal del DI"></span>
          <span>© <span data-ova-hueco="año, del DI"></span> Universidad Andina Virtual. Todos los derechos reservados.</span>
        </footer>
      </section>
